name: Bug report
description: Something the library does that it should not, or fails to do — a crash, a wrong value, an exception.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Before anything else: do not attach a real document

        This library extracts text from private legal files. An attachment
        here is **public and permanent** — GitHub keeps issue attachments
        reachable by URL even after the issue is deleted.

        Never paste or attach a real PDF, a real extracted text, a case
        number, a tax ID, a company ID, a name or an address. The repository
        runs `scripts/privacy_check.py` on every push precisely because this
        mistake is easy to make; an issue form has no such scanner.

        If a specific document is the only way to reproduce, say so and we
        will find a way to characterise it — **page profile, engine, page
        count, provenance string** are almost always enough. See
        `tests/conftest.py` for how the suite builds synthetic PDFs with
        invented text: the same trick usually reproduces the bug.

        If the text comes out *bad* rather than *wrong* — empty, garbled,
        truncated, the wrong engine chosen — use the **Extraction quality**
        form instead. It asks the questions that case actually needs.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have not attached or pasted any real document, extracted text or personal data.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, what you got, and why the difference matters.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        The shortest code or command that shows it. A synthetic PDF built with
        PyMuPDF — as `tests/conftest.py` does — is worth more than a
        description, because it can go straight into the suite as a
        regression test.
      render: python
      value: |
        from autosxtract import Cascade

        result = Cascade().extract_file("synthetic.pdf")
        print(result.provenance)
        print(len(result.text))
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or error output
      description: The complete traceback, with any file path replaced by a placeholder.
      render: shell

  - type: textarea
    id: diagnose
    attributes:
      label: Output of `autosxtract diagnose`
      description: |
        Run `autosxtract diagnose` (or `make diagnose`) and paste it whole.
        It gives the version, the machine, the resolved parallelism, which
        engines are available with the reason for each absence, and the
        assembled cascade. The commonest cause of a surprising result is a
        missing engine, and this is the only output that says so.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: autosxtract version
      description: The first line of `diagnose`, or `python -c "import autosxtract; print(autosxtract.__version__)"`. Say `main@<commit>` if you are on a checkout.
      placeholder: "0.4.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python -V`. The supported range is 3.11 to 3.13.
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and hardware
      description: Include the CPU architecture, and say if you are inside a container — `os.cpu_count()` lies there, and parallelism bugs usually come from that.
      placeholder: "macOS 14.5 (arm64) / Ubuntu 24.04 (x86_64) in Docker with --cpus=4"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - pip install autosxtract
        - pip install "autosxtract[all]"
        - pip install with a specific extra (say which below)
        - pip install -e . from a checkout
        - other (say below)
    validations:
      required: true

  - type: textarea
    id: extras
    attributes:
      label: Extras and system tools installed
      description: |
        Which extras (`apple`, `paddle`, `paddleocr`, `veto`, `onnx`, `remote`,
        `docling`), and whether the Tesseract binary is on the PATH. `pip
        freeze | grep -Ei "rapidocr|onnxruntime|paddle|pymupdf|pyobjc|ocrmac"`
        answers most of it.
      render: shell

  - type: textarea
    id: config
    attributes:
      label: The `Config` you used
      description: If you changed any default, paste the `Config(...)` call. Every threshold in `config.py` was fixed by a measurement, and an overridden one changes which step wins.
      render: python
