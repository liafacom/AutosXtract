name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing in this workflow writes to the repository, comments
# on a pull request or publishes anything, so the token gets read access and
# nothing else. GitHub's default for a repository can be read-write for every
# workflow; declaring it here means CI keeps the narrow token even if that
# default is loosened later, and a compromised dependency executed during
# `pip install` cannot push a commit with it.
permissions:
  contents: read

# One run per branch. A push that lands while the previous run is still going
# makes the earlier one irrelevant — the merge decision is made on the newest
# commit — and the macOS runner is the scarcest resource here.
#
# Cancellation applies to pull requests only. On `main` every run is kept: the
# per-commit history of which commit was green is what a bisect stands on, and
# a cancelled run leaves a hole in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to their major tag (`@v4`, `@v5`), and Dependabot's
# `github-actions` ecosystem opens a pull request when a new major appears.
# Pinning to a full commit SHA is stricter still — it is what protects against
# a compromised tag being moved — and is the natural next step the day this
# repository publishes from a workflow with more than the read token below.

jobs:
  # The leak gate, and the first job on purpose.
  #
  # `scripts/privacy_check.py` also runs inside `quality` below, and the
  # duplication is deliberate. It exists as a job of its own for three reasons,
  # in rising order of importance:
  #
  #   1. A ruleset can only require a check by NAME. Inside `quality` the scan
  #      has no name of its own — the only thing a rule could demand is
  #      "quality (3.11) is green", which conflates a leak with a lint error and
  #      cannot say which one blocked the merge. As its own job it becomes a
  #      required status check in its own right, which is the only way to state
  #      in configuration that a leak stops a merge.
  #   2. It answers in seconds. There is no `pip install` in front of it — the
  #      scanner imports nothing outside the standard library — so the check
  #      that matters most is the first red mark a reviewer sees, not the one
  #      that arrives after the macOS runner finishes.
  #   3. Inside `quality` it runs AFTER the install and the tests. A dependency
  #      that fails to resolve, or a test that hangs, means the privacy scan
  #      NEVER RUNS — the one guardrail whose failure cannot be undone is also
  #      the one most easily starved by an unrelated defect. Here nothing can
  #      starve it.
  #
  # It stays in `quality` as well because `make all` runs it locally in that
  # order, and a check that is cheap and prevents something irreversible is
  # worth running twice.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # `python3`, not the venv and not `setup-python`: the scanner parses on
      # Python 3.8 upwards with the standard library only, which is exactly what
      # lets this job have no setup at all.
      - name: Privacy scan
        run: python3 scripts/privacy_check.py .

  quality:
    runs-on: ubuntu-latest
    # No job here has a timeout by default, which means 360 minutes. A hung job
    # is not merely slow: it is a REQUIRED CHECK that never reports, so the
    # merge button waits six hours for a run nobody is watching. Every number
    # below is roughly four times the job's observed duration — long enough not
    # to fire on a slow runner, short enough that a hang is a failure within the
    # hour.
    timeout-minutes: 25
    # The matrix is the supported range from pyproject's `requires-python`,
    # end to end, and the two ends are what actually catch things: 3.11 is the
    # floor a user's environment is most likely to be pinned at, 3.13 is where
    # a dependency's stubs or C extension breaks first. Nothing here is
    # allowed to be "tested on the maintainer's interpreter".
    #
    # `fail-fast: false` because a failure on 3.13 alone is a different defect
    # from a failure everywhere, and killing the other jobs hides which one it
    # is.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # A HARD gate, like the two above it. It carried `continue-on-error: true`
      # and no other job ran mypy, so type checking was advisory everywhere —
      # while GUARDRAILS.md listed "types" among the required checks, and
      # README, CONTRIBUTING and the PR template all present `make all`, where
      # `typecheck` cannot be skipped, as equal to what CI runs. A check nobody
      # can fail is documentation, not a guardrail.
      - name: Types
        run: mypy autosxtract

      # This job installs `.[dev]` and nothing more. That is NOT the bare core:
      # rapidocr and onnxruntime are mandatory runtime dependencies, so the OCR
      # stack is here whether or not an extra is named. What separates this job
      # from `with-ocr` is the absence of libGL, which is what decides whether
      # the engine is importable — see the comment in that job.
      #
      # `-m "not apple"` is not decoration. A declared marker deselects nothing
      # on its own: without the filter this job RUNS the Vision tests on Linux
      # and reports their failure as a defect in the code. The `apple` job below
      # is the only place they mean anything.
      - name: Tests (core)
        run: pytest -m "not apple" --cov=autosxtract --cov-report=term-missing

      # Runs on EVERY push, not only on a release: it is cheap, and it is the
      # only automatic defence against an accidental `git add -A` in a directory
      # that sits next to the real documents the library extracts.
      - name: Privacy scan
        run: python scripts/privacy_check.py .

  # Step 2 off Apple hardware, with the real engine. Kept separate because it
  # downloads ONNX Runtime and the PP-OCRv6 weights — expensive to run across
  # the whole matrix.
  with-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # rapidocr depends on the DESKTOP opencv while this project declares the
      # headless one, and both install the same `cv2`. Whichever pip unpacks
      # last wins, and the desktop build needs libGL — absent on a bare runner.
      # The failure is not an error message: `import cv2` raises, the engine
      # goes unavailable, and this job passes with `paddle` INERT, testing the
      # bare core it was created not to test.
      - name: System libraries for the desktop opencv build
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install with the engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,paddle]"
      # Assert the engine is really there before trusting anything this job says.
      - name: The engine has to be available, not merely installed
        run: |
          python -c "import cv2; print('cv2', cv2.__version__)"
          python -m autosxtract.cli diagnose
          python -c "import sys; from autosxtract.engines import available; \
            names = [e.name for e in available()]; print('available:', names); \
            sys.exit(0 if 'paddle' in names else 'paddle is not available - this job would prove nothing')"
      - name: Integration tests
        run: pytest -m "not apple" -q

  # Apple's cascade can only be exercised on a macOS runner.
  apple:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install with Vision
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,apple]"
      - name: Diagnose
        run: python -m autosxtract.cli diagnose
      - name: Tests
        run: pytest -q

  # CI resolves dependencies fresh on every run, so a green matrix says nothing
  # about the pinned environment a newcomer actually gets. This job installs
  # against `constraints/dev.txt` — and only on 3.13, where the pins were
  # resolved. Pinning the whole matrix would be worse than not pinning it: the
  # matrix exists to catch a package that stops resolving on 3.11, and pinned
  # runs cannot catch that.
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install against the pins
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints/dev.txt
      - name: Lint and test with the pinned toolchain
        run: |
          ruff check .
          ruff format --check .
          pytest -m "not apple" -q
      # A hand-edited pin file is a pin file nobody can regenerate. The check is
      # cheap and it is the only thing that keeps the lock honest.
      - name: The pins must be reproducible from the declared graph
        run: |
          python scripts/lock.py
          git diff --exit-code constraints/dev.txt

  # The newcomer path, which no other job exercises. Everything else here starts
  # from an environment CI built its own way; this starts from `git clone`, and
  # it is the only job that can catch the bootstrap script rotting.
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: One command, from a fresh clone
        run: ./scripts/bootstrap.sh --no-hooks
      - name: The suite has to pass in what bootstrap built
        run: .venv/bin/python -m pytest -q

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Importing in a clean environment catches the commonest packaging
      # error: a subpackage forgotten in the wheel, which only shows outside the
      # repository.
      - name: Install in a clean environment and import
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import autosxtract; print(autosxtract.__version__)"
          /tmp/clean/bin/autosxtract diagnose
