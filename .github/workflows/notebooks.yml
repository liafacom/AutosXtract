name: Notebooks

# The notebooks are documentation that claims to run. Unexecuted, they rot in
# a specific and embarrassing way: the API is renamed, the notebook keeps its
# stored output from months ago, and it reads as if it still works. Executing
# them headlessly on every push is what makes that impossible.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  execute:
    # Named so the check reads as what it is. Deliberately NOT a required status
    # check: this job downloads the PP-OCRv6 weights and executes real OCR, so
    # its red is sometimes the network's and not the diff's — and a required
    # check that is flaky teaches everyone to merge past red, which costs more
    # than the notebooks are worth. It is watched, not enforced.
    name: notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same reasoning as in docs.yml: `hashFiles` needs the workspace, so the
      # guard is a step after the checkout and not an `if:` on the job. The
      # notebooks are being written separately; until they land this job has to
      # pass quietly rather than sit red.
      - name: Are there notebooks?
        id: detect
        run: |
          if [ "${{ hashFiles('notebooks/**/*.ipynb') }}" != "" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no notebooks/ yet — nothing to execute"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: "3.11"
          cache: pip

      # nbclient, nbconvert and ipykernel are installed HERE, in the job, and
      # are deliberately not a project extra. A notebook runner has no business
      # in the dependency graph of a library whose whole selling point is that
      # `pip install autosxtract` brings a complete cascade and nothing else —
      # and `make notebooks` says the same thing locally, refusing with an
      # instruction rather than dragging Jupyter in for everybody who only
      # wants to run the tests.
      #
      # The package goes in with `[dev]` so the notebooks can use the same
      # synthetic-fixture machinery the suite uses.
      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nbclient nbconvert ipykernel

      # The PP-OCRv6 weights are fetched once, up front, so that a notebook
      # that reaches the OCR step does not fail on a cold cache — and so the
      # download failure, if it comes, is reported as a download failure rather
      # than as a broken notebook.
      - name: Download the OCR weights
        if: steps.detect.outputs.found == 'true'
        run: python -m autosxtract.cli download-models
        continue-on-error: true

      - name: Diagnose
        if: steps.detect.outputs.found == 'true'
        run: python -m autosxtract.cli diagnose

      # `jupyter execute` (from nbclient) runs each notebook top to bottom and
      # exits non-zero on the first cell that raises. `make notebooks` does the
      # same thing locally through nbconvert, which delegates execution to
      # nbclient underneath — the same engine, so a notebook that passes here
      # passes there.
      #
      # Output is not written back: a notebook whose committed outputs are
      # regenerated by CI produces a diff on every run, and — more to the
      # point — stored outputs are exactly where an extracted fragment of a real
      # document would end up committed by accident. Notebooks here are
      # committed with their outputs CLEARED, and this job proves they still
      # run.
      #
      # MPLBACKEND=Agg because there is no display on the runner and a plotting
      # cell would otherwise hang until the job times out rather than fail.
      - name: Execute
        if: steps.detect.outputs.found == 'true'
        env:
          MPLBACKEND: Agg
        run: |
          shopt -s globstar nullglob
          for nb in notebooks/**/*.ipynb; do
            echo "::group::$nb"
            jupyter execute --timeout=600 "$nb"
            echo "::endgroup::"
          done

      # A notebook must not need a document that is not in the repository, and
      # must not leave one behind. The scan runs after execution for the second
      # half of that: a cell that writes an extracted text next to the notebook
      # is caught here rather than by whoever commits afterwards.
      - name: Privacy scan
        if: steps.detect.outputs.found == 'true'
        run: python scripts/privacy_check.py .
