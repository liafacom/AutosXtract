# The documentation site. `mkdocs` is deliberately NOT a project dependency:
# `pip install autosxtract` must not drag a documentation toolchain onto a
# user's machine. The pins live in docs/requirements.txt, which
# .github/workflows/docs.yml prefers over its own fallback list.

site_name: AutosXtract
site_description: Cascading PDF text extraction — cheapest step first, stopping at the first one that suffices
site_url: https://liafacom.github.io/AutosXtract/
repo_url: https://github.com/liafacom/AutosXtract
repo_name: liafacom/AutosXtract
edit_uri: edit/main/docs/
copyright: MIT

# `--strict` turns every warning into a failure, and these two are the warnings
# worth failing on: a link to a page that was renamed, and a page that exists
# but sits in no nav entry, reachable only by guessing the URL.
strict: false # the flag on the command line decides; CI always passes --strict

# Anchors are validated too, and that is not decoration: collapsing the eleven
# ADR files into one page turned every `adr/0003-….md` into an `index.md#0003-…`,
# and a renamed heading would silently produce a link that lands at the top of
# the page instead of at the record. `warn` plus `--strict` makes it a failure.
validation:
  anchors: warn
  unrecognized_links: warn

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    # Three states, because the page has to be readable in whatever the reader
    # already chose. `media` picks the system default on first visit.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light

# The configuration reference is GENERATED from the pydantic model at build
# time — see docs/hooks/config_reference.py. A hand-copied table of forty
# fields is a table that goes stale, and the measurement in each field's
# description is the part that must not.
hooks:
  - docs/hooks/config_reference.py

# Everything here lives under docs/ for convenience but must not be published:
# the hook is code, the requirements file is a pin list. Without this, --strict
# fails them for being outside the nav.
exclude_docs: |
  hooks/
  requirements.txt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Material renders Mermaid natively once the fence is registered here.
        # No JavaScript dependency to pin, and the diagram stays a diff-able
        # text block in the page it explains.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Command line: cli.md
  - Python API: api.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Quality gates: gates.md
  - Files that are not PDFs: formats.md
  - Extending:
      - A new engine: extending/engine.md
      - A new step: extending/step.md
      - A new pattern pack: extending/patterns.md
      - The interfaces: interfaces.md
  - Testing: testing.md
  - Decision records: adr/index.md
