# AutosXtract pattern catalogue — Brazilian legal Portuguese.
#
# This is the pack the library was measured on, and the one that loads when
# ``Config.language`` names no other. It is layered ON TOP of ``base.toml``:
# only what actually depends on the language and the domain lives here.
#
# The English-in-the-code rule stops at this file. Names, docstrings and
# messages are English so the library is usable outside Brazil; the patterns
# are Portuguese because they describe the corpus — the conformity stamp, the
# enclitic pronouns, the forensic abbreviations, the identity-card markers.
# This file is the adaptation seam: another language ships another pack and the
# Python does not change.

# ── metrics ─────────────────────────────────────────────────────────────

[metrics.allowed_chars]
why = '''
The repertoire a document of this corpus prints. Everything outside it counts as an odd
character, and the ratio of odd characters is the first evidence that what came back is not
text. Adapting to another language means adding its letters here.
'''
pattern = '''[^a-zA-Z0-9áàâãéèêíìîóòôõúùûçÁÀÂÃÉÈÊÍÌÎÓÒÔÕÚÙÛÇ.,;:!?()\\/\"'`\-–—ºª°%\n\r\t ]'''

[metrics.stopwords]
why = '''
Function words of the corpus language — the cheapest and strongest discriminator for 'is this
Portuguese?'. Running prose sits between 0.20 and 0.30; an unreadable transcription sits below
0.03. Written as running text on purpose: this list is meant to be read and edited by whoever
adapts the library to another language, and sixty quoted strings are not readable.
'''
words = '''

de da do das dos e a o os as em no na nos nas para por com que se ao aos à às um uma uns umas
ou mas como quando onde este esta esse essa aquele aquela seu sua seus suas pelo pela pelos pelas
nao não sim ser foi sao são tem ter entre sobre sem até após desde
'''

[metrics.domain]
why = '''
Vocabulary expected from the domain. This is the only criterion that can ADD to the score.
Swapping this list adapts the library to another corpus; leaving it empty turns the adjustment
off without breaking anything.
'''
patterns = [
    '\bprocesso\b',
    '\bautos\b',
    '\bsenten[cç]a\b',
    '\bac[oó]rd[aã]o\b',
    '\bdecis[aã]o\b',
    '\bdespacho\b',
    '\bpeti[cç][aã]o\b',
    '\brequerente\b',
    '\brequerido\b',
    '\bexequente\b',
    '\bexecutado\b',
    '\bimpetrante\b',
    '\bimpetrado\b',
    '\btribunal\b',
    '\bvara\b',
    '\bjuiz\b',
    '\bdesembargador\b',
    '\bminist[eé]rio p[uú]blico\b',
]

# ── markers ─────────────────────────────────────────────────────────────

[markers.unread]
why = '''
What a vision model emits when it cannot read a passage. Legitimate in small proportion — a
signature in the middle of a certificate — but on a wholly illegible page the model LOOPS,
repeating the marker until the token budget runs out. Measured on a real archive: one document
returned 6,281 characters of which 41 were real content, in 319 s, and counting the raw text
made that loop look like the richest document in the archive.
'''
pattern = '\[(?:IL+EG[IÍ]VEL|ILLEGIBLE|CARIMBO|STAMP|ASSINATURA|SIGNATURE|TRECHO\s+DANIFICADO|DAMAGED|SELO|SEAL|RUBRICA|IMAGEM|IMAGE|LOGO|BRAS[AÃ]O|VAZIO|EMPTY|EM\s+BRANCO|BLANK|N[AÃ]O\s+IDENTIFIC\w*|UNIDENTIFIED|TEXTO\s+[^\]]*)[^\]]*\]'
flags = ["IGNORECASE"]

# ── lexicon ─────────────────────────────────────────────────────────────

[lexicon.short_words]
why = '''
Function words of two letters or fewer live separately: the tokeniser requires 3+ characters,
but the re-segmentation of run-together words needs them to split ``ESTADODEMATOGROSSODOSUL``
correctly.
'''
words = 'de do da no na em os as ao um no dos das nos nas pelo pela que com sem por para'

[lexicon.builtin]
why = '''
The built-in floor: Portuguese function words plus recurring legal vocabulary. A reasonable
floor, not a truth — a lexicon counted from your own validated texts is measurably better. One
warning worth more than the list itself: a lexicon that is too small makes correct text look
like junk. With this one the thresholds still hold, but average coverage drops and more lines
fall into ``suspect`` — the safe side of the error, since the text passes and only the page's
confidence falls.
'''
words = '''

